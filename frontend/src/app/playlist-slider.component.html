<div #swiper class="playlist-swiper swiper mb-[50px] w-full pt-4 pb-5">
  <div class="swiper-wrapper">
    @for (slide of slides(); track slide.title; let first = $first) {
      <div class="swiper-slide relative">
        <img [src]="slide.image" [alt]="slide.title" [attr.loading]="first ? 'eager' : 'lazy'" [attr.fetchpriority]="first ? 'high' : 'auto'" decoding="async"
          class="playlist-image rounded-[20px] border-2 border-[rgba(167,159,168,0.5)] object-cover">
        <div class="playlist-overlay absolute inset-0 flex flex-col items-start justify-end gap-y-3 rounded-[20px] bg-[linear-gradient(240deg,transparent,transparent,rgba(123,21,149,0.8))]">
          <h3 class="text-[clamp(1.2rem,3vw,2.2rem)] font-bold text-white">{{ slide.title }}</h3>
          <button type="button" (click)="choose.emit(slide.image)"
            class="flex w-max cursor-pointer items-center justify-center gap-x-2.5 rounded-xl border border-[rgba(168,159,167,0.4)] bg-[#ebe6ea2a] px-4 py-3 backdrop-blur-sm text-[clamp(0.7rem,3vw,1rem)] font-medium text-[#e0d8d8] uppercase shadow-button transition-all duration-[400ms] ease-linear hover:bg-white hover:text-plum focus-visible:bg-white focus-visible:text-plum max-[825px]:px-3 max-[825px]:py-2">
            Explore <i class="fa-solid fa-circle-play" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    }
  </div>
  <div #pagination class="swiper-pagination"></div>
</div>
