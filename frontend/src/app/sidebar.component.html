<nav class="sticky top-5 flex h-[calc(100svh-40px)] flex-col justify-between pt-3 pb-5" aria-label="Main">
  @for (items of groups; track $index; let first = $first) {
    <div>
      @if (first) {
        <div>
          <div class="relative mx-auto mb-2 w-max max-w-full p-[12px_24px_6px] max-[1500px]:p-[12px_12px_6px] max-[450px]:p-[6px_6px_2px]">
            <span class="block rounded-full bg-linear-to-br from-blush via-orchid to-plum p-[3px] shadow-glow">
              <img [src]="user.avatar" alt="" class="block aspect-square max-w-[110px] rounded-full border-2 border-white/70 object-cover">
            </span>
            <span class="absolute right-[30px] bottom-3 size-3.5 rounded-full border-2 border-white bg-[#1f9d62] max-[1500px]:right-[16px] max-[450px]:right-2 max-[450px]:bottom-1.5 max-[450px]:size-2.5" aria-hidden="true"></span>
          </div>
          <p class="px-1.5 text-center text-[clamp(0.8rem,3vw,1rem)] leading-none font-bold text-[#140606]">{{ user.name }}</p>
          <p class="px-1.5 pt-1.5 pb-8 text-center text-[0.75rem] text-plum/80 max-[1500px]:sr-only">Premium member</p>
        </div>
      }
      <ul class="flex flex-col gap-1">
        @for (item of items; track item.label) {
          <li class="px-2">
            <button type="button" (click)="navigate.emit(item)" [attr.aria-current]="active() === item.label ? 'true' : null"
              class="flex w-full cursor-pointer items-center justify-center rounded-[10px] py-3 text-base text-[#1a0505] transition-all duration-300 hover:bg-white/30 aria-[current]:bg-linear-to-r aria-[current]:from-orchid aria-[current]:to-grape aria-[current]:text-white aria-[current]:shadow-glow">
              <i class="fa-solid h-5 w-10 text-[1.1rem] max-[1500px]:translate-y-[2px] max-[1500px]:text-center" [class]="item.icon" aria-hidden="true"></i>
              <span class="block h-5 w-[70px] text-left max-[1500px]:sr-only">{{ item.label }}</span>
            </button>
          </li>
        }
      </ul>
    </div>
  }
</nav>
