<nav class="sticky top-5 flex h-[calc(100svh-40px)] flex-col justify-between pt-3 pb-5" aria-label="Main">
  @for (items of groups; track $index; let first = $first) {
    <div>
      @if (first) {
        <div>
          <img [src]="user.avatar" alt="" class="rounded-full p-[12px_24px_6px] max-[1500px]:p-[12px_12px_6px] max-[450px]:p-[6px_6px_2px]">
          <p class="px-1.5 pb-8 text-center text-[clamp(0.8rem,3vw,1rem)] leading-none font-medium text-[#140606]">{{ user.name }}</p>
        </div>
      }
      <ul>
        @for (item of items; track item.label) {
          <li class="px-2">
            <button type="button" (click)="navigate.emit(item)" [attr.aria-current]="active() === item.label ? 'true' : null"
              class="flex w-full cursor-pointer items-center justify-center rounded-[5px] py-3 text-base text-[#1a0505]"
              [class.bg-nav-active]="active() === item.label">
              <i class="fa-solid h-5 w-10 text-[1.1rem] max-[1500px]:translate-y-[2px] max-[1500px]:text-center" [class]="item.icon" aria-hidden="true"></i>
              <span class="block h-5 w-[70px] text-left max-[1500px]:sr-only">{{ item.label }}</span>
            </button>
          </li>
        }
      </ul>
    </div>
  }
</nav>
